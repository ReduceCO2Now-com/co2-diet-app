name: co2diet
description: CO2 Diet — privacy-first nutrition and CO2 footprint tracker
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.6"

dependencies:
  drift: 2.34.2
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.3.2
  freezed_annotation: 3.1.0
  go_router: 17.3.0
  # intl pinned to 0.20.2 — SDK flutter_localizations pins to this version.
  intl: 0.20.2
  path_provider: ^2.1.6
  riverpod_annotation: 4.0.3
  uuid: 4.6.0

dev_dependencies:
  # build_runner 2.15.1 used (not 2.15.2) — 2.15.2 requires analyzer >=13.3 which
  # conflicts with riverpod_generator 4.0.4 (analyzer ^12).
  build_runner: 2.15.1
  # custom_lint removed — riverpod_lint 3.1.4 migrated from custom_lint to
  # analysis_server_plugin; the two packages' analyzer constraints are mutually exclusive.
  drift_dev: 2.34.0
  flutter_test:
    sdk: flutter
  # freezed 3.2.6-dev.1 used (not 3.2.5 stable) — 3.2.5 requires analyzer >=9 <11
  # which conflicts with riverpod_lint 3.1.4 (analyzer ^12). The dev.1 build
  # aligns with the ^12 requirement.
  freezed: 3.2.6-dev.1
  integration_test:
    sdk: flutter
  mocktail: 1.0.5
  riverpod_generator: 4.0.4
  riverpod_lint: 3.1.4
  very_good_analysis: 10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
