name: co2diet
description: CO2 Diet — privacy-first nutrition and CO2 footprint tracker
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.6"

dependencies:
  # archive 4.0.9 — Pure Dart GZip decompression for first-launch off_reference.sqlite.gz
  # extraction; no FFI, no native binaries. [VERIFIED: pub.dev, loki3d.com publisher]
  archive: 4.0.9
  # app_settings 8.0.3 — Deep-link to OS Settings app for permission-denied recovery.
  # AppSettings.openAppSettings() handles iOS/Android platform difference.
  # [VERIFIED: pub.dev 2026-07-21, 160/160 score]
  app_settings: 8.0.3
  # connectivity_plus 7.3.0 — Detect network state before OFF API fallback calls.
  # [VERIFIED: pub.dev, flutter.dev ecosystem publisher]
  connectivity_plus: 7.3.0
  # flutter_slidable 4.0.3 — Swipe-to-reveal Edit/Duplicate/Delete actions on
  # dashboard meal-entry rows (LOG-09). [VERIFIED: pub.dev, 150/160 score,
  # flutter-favorite badge, publisher: romainrastel.com, human-approved
  # per Plan 04-11's blocking package-legitimacy checkpoint]
  flutter_slidable: ^4.0.3
  # mobile_scanner 7.4.0 — Barcode scanning via CameraX/MLKit (Android) and AVFoundation (iOS).
  # [VERIFIED: pub.dev 2026-07-21, 160/160 score, 1.06M downloads/month]
  mobile_scanner: 7.4.0
  # permission_handler 12.0.3 — Camera permission pre-check and status query before
  # showing the native dialog. publisher: baseflow.com.
  # [VERIFIED: pub.dev 2026-06-01, 160/160 score]
  permission_handler: 12.0.3
  drift: 2.34.2
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.3.2
  freezed_annotation: 3.1.0
  go_router: 17.3.0
  # intl pinned to 0.20.2 — SDK flutter_localizations pins to this version.
  intl: 0.20.2
  # openfoodfacts 3.30.2 — Official OFF Dart client for API fallback search.
  # [VERIFIED: pub.dev, openfoodfacts.org publisher]
  openfoodfacts: 3.30.2
  # path is a transitive dep of path_provider; declared directly per
  # very_good_analysis depend_on_referenced_packages rule.
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: 4.0.3
  # shimmer 3.0.0 — Skeleton loading rows during OFF API fallback (not for local FTS5).
  # [VERIFIED: pub.dev]
  shimmer: 3.0.0
  uuid: 4.6.0
  # url_launcher ^6.3.1 — opens GitHub methodology link in system browser
  # (privacy-preferred over embedded WebView). [RESEARCH.md Open Questions #2]
  # [VERIFIED: pub.dev, flutter.dev publisher, 160/160 pub score]
  url_launcher: ^6.3.1

dev_dependencies:
  # build_runner 2.15.1 used (not 2.15.2) — 2.15.2 requires analyzer >=13.3 which
  # conflicts with riverpod_generator 4.0.4 (analyzer ^12).
  build_runner: 2.15.1
  # custom_lint removed — riverpod_lint 3.1.4 migrated from custom_lint to
  # analysis_server_plugin; the two packages' analyzer constraints are mutually exclusive.
  # drift_dev 2.34.0 — cannot upgrade to 2.34.4 because freezed 3.2.6-dev.1
  # requires analyzer ^12 while drift_dev >=2.34.1+1 requires analyzer ^13.
  # The 'dart run drift_dev schema dump' CLI is broken with drift 2.34.2
  # (drift3_preview API mismatch). Use tool/generate_schema_v1.dart instead.
  drift_dev: 2.34.0
  flutter_test:
    sdk: flutter
  # freezed 3.2.6-dev.1 used (not 3.2.5 stable) — 3.2.5 requires analyzer >=9 <11
  # which conflicts with riverpod_lint 3.1.4 (analyzer ^12). The dev.1 build
  # aligns with the ^12 requirement.
  freezed: 3.2.6-dev.1
  integration_test:
    sdk: flutter
  mocktail: 1.0.5
  riverpod_generator: 4.0.4
  riverpod_lint: 3.1.4
  very_good_analysis: 10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/off_reference.sqlite.gz
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
