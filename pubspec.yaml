name: co2diet
description: CO2 Diet — privacy-first nutrition and CO2 footprint tracker
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.6"

dependencies:
  # archive 3.6.1 (downgraded from 4.0.9 during Plan 05-09 execution) — Pure Dart
  # GZip decompression for first-launch off_reference.sqlite.gz extraction, and
  # ZipFileEncoder/ZipDecoder for backup/export zip generation (PRIV-01/02/04);
  # no FFI, no native binaries. [VERIFIED: pub.dev, loki3d.com publisher]
  # PINNED at 3.6.1 (not 4.0.9): `excel` 4.0.6 hard-depends on `archive ^3.6.1`
  # and calls archive APIs (`ZipDecoder.decodeBuffer`, `InputStream`) that were
  # renamed/removed in archive 4.0.0 — the two cannot coexist in this project.
  # 3.6.1 is the last 3.x release and keeps every API this codebase actually
  # uses (`GZipDecoder.decodeBytes`, `ZipFileEncoder.open/addArchiveFile/close`,
  # `ZipDecoder.decodeBytes`, `ArchiveFile.string`) unchanged from 4.0.9 — see
  # 05-09-SUMMARY.md Deviations for the full compatibility check.
  archive: 3.6.1
  # app_settings 8.0.3 — Deep-link to OS Settings app for permission-denied recovery.
  # AppSettings.openAppSettings() handles iOS/Android platform difference.
  # [VERIFIED: pub.dev 2026-07-21, 160/160 score]
  app_settings: 8.0.3
  # connectivity_plus 7.3.0 — Detect network state before OFF API fallback calls.
  # [VERIFIED: pub.dev, flutter.dev ecosystem publisher]
  connectivity_plus: 7.3.0
  # flutter_slidable 4.0.3 — Swipe-to-reveal Edit/Duplicate/Delete actions on
  # dashboard meal-entry rows (LOG-09). [VERIFIED: pub.dev, 150/160 score,
  # flutter-favorite badge, publisher: romainrastel.com, human-approved
  # per Plan 04-11's blocking package-legitimacy checkpoint]
  flutter_slidable: ^4.0.3
  # mobile_scanner 7.4.0 — Barcode scanning via CameraX/MLKit (Android) and AVFoundation (iOS).
  # [VERIFIED: pub.dev 2026-07-21, 160/160 score, 1.06M downloads/month]
  mobile_scanner: 7.4.0
  # permission_handler 12.0.3 — Camera permission pre-check and status query before
  # showing the native dialog. publisher: baseflow.com.
  # [VERIFIED: pub.dev 2026-06-01, 160/160 score]
  permission_handler: 12.0.3
  drift: 2.34.2
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.3.2
  freezed_annotation: 3.1.0
  go_router: 17.3.0
  # intl pinned to 0.20.2 — SDK flutter_localizations pins to this version.
  intl: 0.20.2
  # openfoodfacts 3.30.2 — Official OFF Dart client for API fallback search.
  # [VERIFIED: pub.dev, openfoodfacts.org publisher]
  openfoodfacts: 3.30.2
  # path is a transitive dep of path_provider; declared directly per
  # very_good_analysis depend_on_referenced_packages rule.
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: 4.0.3
  # shimmer 3.0.0 — Skeleton loading rows during OFF API fallback (not for local FTS5).
  # [VERIFIED: pub.dev]
  shimmer: 3.0.0
  uuid: 4.6.0
  # url_launcher ^6.3.1 — opens GitHub methodology link in system browser
  # (privacy-preferred over embedded WebView). [RESEARCH.md Open Questions #2]
  # [VERIFIED: pub.dev, flutter.dev publisher, 160/160 pub score]
  url_launcher: ^6.3.1
  # fl_chart 1.2.0 — Dashboard sparkline (05-11), Weight Tracking chart (05-13),
  # Data Analysis trend section (05-15). [VERIFIED: pub.dev 2026-07-27, 150/160
  # score, BSD-3, publisher imaNNeo (github.com/imaNNeo/fl_chart), human-approved
  # per Plan 05-08's blocking package-legitimacy checkpoint]
  fl_chart: ^1.2.0
  # flutter_local_notifications 22.2.0 — local meal-slot and weigh-in reminder
  # scheduling (NOTIF-01/02/03), named-parameter API only (v20+).
  # [VERIFIED: pub.dev 2026-07-27, 150/160 score, publisher MaikuB
  # (github.com/MaikuB/flutter_local_notifications), human-approved per
  # Plan 05-08's blocking package-legitimacy checkpoint]
  flutter_local_notifications: ^22.2.0
  # timezone 0.11.1 — mandatory transitive companion of
  # flutter_local_notifications' zonedSchedule (TZDateTime).
  # [VERIFIED: pub.dev 2026-07-27, 150/160 score, human-approved per
  # Plan 05-08's blocking package-legitimacy checkpoint]
  timezone: ^0.11.1
  # flutter_timezone 5.1.0 — reads the device's IANA timezone name at runtime
  # to feed timezone package's setLocalLocation.
  # [VERIFIED: pub.dev 2026-07-27, 150/160 score, publisher tjarvstrand
  # (github.com/tjarvstrand/flutter_timezone), human-approved per Plan 05-08's
  # blocking package-legitimacy checkpoint]
  flutter_timezone: ^5.1.0
  # share_plus 13.3.0 — hands the generated backup/export zip to the OS share
  # sheet (PRIV-02). [VERIFIED: pub.dev 2026-07-27, 150/160 score, BSD-3,
  # verified publisher fluttercommunity.dev (github.com/fluttercommunity/
  # plus_plugins), human-approved per Plan 05-09's blocking package-legitimacy
  # checkpoint]
  share_plus: ^13.3.0
  # csv 8.0.0 — encodes selected export categories to CSV (PRIV-01).
  # [VERIFIED: pub.dev 2026-07-27, 150/160 score, MIT, zero dependencies,
  # github.com/close2/csv, human-approved per Plan 05-09's blocking
  # package-legitimacy checkpoint]
  csv: ^8.0.0
  # excel 4.0.6 — encodes selected export categories to genuine .xlsx
  # (PRIV-01); the only Dart-ecosystem package producing real .xlsx rather
  # than CSV-with-.xlsx-extension. [VERIFIED: pub.dev 2026-07-27, 115/160
  # score (lower — last published 2024-08-20, no newer release since),
  # verified publisher justkawal.dev (github.com/justkawal/excel), explicitly
  # re-verified and human-approved per Plan 05-09's blocking
  # package-legitimacy checkpoint, which paid special attention to this
  # package's staleness signal. Forces `archive` to be pinned at 3.6.1 (see
  # that dependency's comment above) — excel 4.0.6 depends on `archive
  # ^3.6.1` and does not support archive 4.x.]
  excel: 4.0.6
  # file_selector 1.1.0 — official dart-lang/flutter team federated plugin
  # (github.com/flutter/packages) opening the real OS document picker for
  # Restore Data (PRIV-04), so a backup zip can be imported from anywhere
  # on the device, not only this app's own documents directory.
  # [VERIFIED: pub.dev 2026-07-27, publisher flutter.dev, 160/160 score,
  # 435 likes, 328,131 30-day downloads, BSD-3-Clause, not discontinued.
  # Chosen over the more commonly-recalled `file_picker` community package
  # specifically because it's the officially-blessed, minimal, no-analytics
  # alternative from the same team that maintains Flutter itself — mirrors
  # the `fl_chart`-over-`syncfusion_flutter_charts` reasoning in
  # RESEARCH.md. No network I/O in its dependency graph. Human-approved
  # per Plan 05-16's blocking package-legitimacy checkpoint.]
  file_selector: ^1.1.0

dev_dependencies:
  # build_runner 2.15.1 used (not 2.15.2) — 2.15.2 requires analyzer >=13.3 which
  # conflicts with riverpod_generator 4.0.4 (analyzer ^12).
  build_runner: 2.15.1
  # custom_lint removed — riverpod_lint 3.1.4 migrated from custom_lint to
  # analysis_server_plugin; the two packages' analyzer constraints are mutually exclusive.
  # drift_dev 2.34.0 — cannot upgrade to 2.34.4 because freezed 3.2.6-dev.1
  # requires analyzer ^12 while drift_dev >=2.34.1+1 requires analyzer ^13.
  # The 'dart run drift_dev schema dump' CLI is broken with drift 2.34.2
  # (drift3_preview API mismatch). Use tool/generate_schema_v1.dart instead.
  drift_dev: 2.34.0
  flutter_test:
    sdk: flutter
  # freezed 3.2.6-dev.1 used (not 3.2.5 stable) — 3.2.5 requires analyzer >=9 <11
  # which conflicts with riverpod_lint 3.1.4 (analyzer ^12). The dev.1 build
  # aligns with the ^12 requirement.
  freezed: 3.2.6-dev.1
  integration_test:
    sdk: flutter
  mocktail: 1.0.5
  # plugin_platform_interface 2.1.8 — was already a transitive dep of
  # share_plus; declared directly so backup_restore_screen_test.dart can
  # use MockPlatformInterfaceMixin to mock SharePlatform.instance.
  plugin_platform_interface: 2.1.8
  riverpod_generator: 4.0.4
  riverpod_lint: 3.1.4
  # share_plus_platform_interface 7.2.0 — was already a transitive dep of
  # share_plus; declared directly so backup_restore_screen_test.dart can
  # construct ShareResult/ShareParams and mock SharePlatform without
  # touching the real platform channel.
  share_plus_platform_interface: 7.2.0
  # Direct dep so test/data/local/food_catalog_dao_ranking_test.dart can build
  # a real off_ref.sqlite fixture on disk — was already a transitive dep of
  # drift/drift_flutter, just not declared directly.
  sqlite3: 3.4.0
  very_good_analysis: 10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/off_reference.sqlite.gz
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
